<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terms and Licence</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --border: rgba(11,11,11,0.10); --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --border: rgba(255,255,255,0.10); --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --border: rgba(255,255,255,0.10); --accent: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 32px; }
h2 { font-size: 26px; margin: 0 0 12px; letter-spacing: -0.01em; }
h3 { font-size: 17px; margin: 28px 0 6px; }
p, li { color: var(--ink-2); }
a { color: var(--accent); }
code { font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
pre { white-space: pre-wrap; font-size: 12px; line-height: 1.5; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px; color: var(--ink-2); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
<!--__TERMS__-->
<h3 id="licence">Licence</h3>
<pre><!--__LICENSE__--></pre>
</main>
</body>
</html>
